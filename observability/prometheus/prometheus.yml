global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otelcol
    static_configs:
      - targets: ["otelcol:9464"]


# Scrape local lambda adapters running on the host.
# Requires: extra_hosts: host.docker.internal:host-gateway (we use --add-host in docker run).
  - job_name: read_metrics_from_users_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: read_exercises_from_dynamo_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: read_statistics_from_exercises_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: add_user_metrics_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: add_question_to_dynamo_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8084"]

  - job_name: add_feedback_for_recomendation_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8085"]

  - job_name: read_openai_questions_recommendations_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8086"]

  - job_name: add_user_profile_infos_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8087"]

  - job_name: read_user_profile_infos_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8088"]

  - job_name: frontend_event_reciever_local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8089"]
